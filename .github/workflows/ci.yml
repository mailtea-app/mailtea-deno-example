name: CI
on:
  push:
    branches: [main]
  pull_request:
  # Lets a run be re-triggered from the Actions tab without a new commit.
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - run: deno task test
